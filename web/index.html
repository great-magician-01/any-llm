<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>any-llm 管理后台</title>
    <script>
      // 必须在首帧绘制前定好主题，否则会先按 :root 的暗色画一帧再跳到浅色（闪屏）。
      // 解析顺序与 src/composables/useTheme.ts 保持一致（内联脚本无法 import 模块）。
      ;(function () {
        var mode = null
        try {
          var v = localStorage.getItem('any-llm-theme')
          if (v === 'light' || v === 'dark') mode = v
        } catch (e) {}
        if (!mode) {
          mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.dataset.theme = mode
        // 配色（accent）没有系统偏好可跟随，读不到就落默认蓝。
        // 合法值清单与 src/utils/accents.ts 的 ACCENT_IDS 保持一致。
        var accent = null
        try {
          var a = localStorage.getItem('any-llm-accent')
          if (a === 'default' || a === 'eva-01' || a === 'eva-02' || a === 'eva-00') accent = a
        } catch (e) {}
        document.documentElement.dataset.accent = accent || 'default'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
