<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>any-llm 管理后台</title>
    <script>
      // 必须在首帧绘制前定好主题，否则会先按 :root 的暗色画一帧再跳到浅色（闪屏）。
      // 解析顺序与 src/composables/useTheme.ts 保持一致（内联脚本无法 import 模块）：
      // 旧版 EVA 配色（迁移时优先于旧明暗）> 已选主题 > 系统深/浅偏好。
      // 合法值清单与 src/utils/themes.ts 的 THEME_IDS 保持一致。
      ;(function () {
        var ids = ['dark', 'light', 'eva-01', 'eva-02', 'eva-00']
        var theme = null
        try {
          var a = localStorage.getItem('any-llm-accent')
          if (a === 'eva-01' || a === 'eva-02' || a === 'eva-00') theme = a
        } catch (e) {}
        if (!theme) {
          try {
            var v = localStorage.getItem('any-llm-theme')
            if (ids.indexOf(v) >= 0) theme = v
          } catch (e) {}
        }
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
