name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # MySQL e2e 套件（internal/db/mysql_e2e_test.go）需要它。
      # 固定 8.0 而非 mysql:8，让结果可复现。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: anyllm
          # 测试库由 harness 自己按 UnixNano 建（DB_TEST_MYSQL_DSN 里只给一个
          # 可连接的初始库），这里建一个空的给它连。
          MYSQL_DATABASE: any_llm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -panyllm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_TEST_MYSQL_DSN: >-
        root:anyllm@tcp(127.0.0.1:3306)/any_llm_test?parseTime=true&loc=Local&charset=utf8mb4&collation=utf8mb4_bin&maxAllowedPacket=0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # main.go has //go:embed web/dist; the real dist is produced by the
      # frontend job's `npm run build`, a stub is enough to compile and test.
      - name: Stub embedded frontend dist
        run: |
          mkdir -p cmd/any-llm/web/dist
          echo '<!doctype html>' > cmd/any-llm/web/dist/index.html

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run test

      # Runs vue-tsc typecheck + vite build.
      - run: npm run build
