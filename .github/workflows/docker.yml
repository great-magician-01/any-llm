name: Docker Build

on:
  push:
    branches: [docker]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 每次构建一个唯一 tag：<UTC 日期>-<短 sha>（如 any-llm:2026.09.24-3e3a51a）。
      # 刻意不再产出 any-llm:latest —— 所有构建堆在同一个 tag 上会互相覆盖，
      # 下载到的 tar 也无法辨认来自哪一次构建。使用方需要 latest 时自行 retag
      # （见 docs/docker.md）。
      - name: Compute image tag
        id: tag
        run: |
          tag="any-llm:$(date -u +%Y.%m.%d)-${GITHUB_SHA:0:7}"
          echo "image=$tag" >> "$GITHUB_OUTPUT"
          echo "image tag: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker save produces a plain POSIX tar (no gzip) — do NOT pipe to gzip.
      - name: Save image as uncompressed .tar
        run: docker save -o any-llm.tar "${{ steps.tag.outputs.image }}"

      - name: Verify archive is tar, not tar.gz
        run: file any-llm.tar

      - name: Upload .tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: any-llm-docker-image
          path: any-llm.tar
          retention-days: 30
